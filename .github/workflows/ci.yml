name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portfolio-market-data
    steps:
      - name: Checkout market package
        uses: actions/checkout@v4
        with:
          path: portfolio-market-data
      - name: Checkout editable core dependency
        uses: actions/checkout@v4
        with:
          repository: T1m-V/portfolio-core
          path: portfolio-core
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.12.3"
      - run: uv python install 3.14
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run python -m pytest
      - run: uv build
